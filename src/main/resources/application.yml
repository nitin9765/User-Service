spring:
  application:
    name: userService
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/userdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        format_sql: false
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: ${KAFKA_SERVER:localhost}:9092
    consumer:
      bootstrap-servers: ${KAFKA_SERVER:localhost}:9092
      group-id: user_group

      enable-auto-commit: false
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    topic:
      name: user_details

logging:
  level:
    root: INFO
    org.apache.kafka: WARN
    kafka: WARN

server:
  port: 8082
